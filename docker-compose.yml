services:
  ome:
    image: ovenmedialabs/ovenmediaengine:latest
    container_name: ome
    restart: unless-stopped
    ports:
      - "1935:1935/tcp"
      - "3333:3333/tcp"
    environment:
      - OME_HOST_IP=127.0.0.1
    volumes:
      - ./Server.xml:/opt/ovenmediaengine/bin/origin_conf/Server.xml:ro
    depends_on:
      - backend
    networks:
      streaming_net:
        ipv4_address: 172.28.0.10

  mysql:
    image: mysql:8.0
    container_name: streaming_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: streaming_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      streaming_net:
        ipv4_address: 172.28.0.20

  backend:
    build: ./backend
    container_name: faketwitch_app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_HOST=172.28.0.20
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=streaming_db
    depends_on:
      - mysql
    networks:
      streaming_net:
        ipv4_address: 172.28.0.30
        

  frontend:
    build: ./frontend
    container_name: faketwitch_frontend
    networks:
      streaming_net:
        ipv4_address: 172.28.0.40
    ports:
      - "80:80"  # Potrai aprire la piattaforma all'indirizzo http://localhost:8080
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:

networks:
  streaming_net:
    name: streaming_net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-faketwitch
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1