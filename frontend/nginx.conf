server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gestione delle rotte di React (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy per le chiamate API REST verso il backend Node.js (172.28.0.30:4000)
    location /api/ {
        proxy_pass http://172.28.0.30:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy per le connessioni WebSocket della chat (/ws/chat)
    location /ws/chat {
        proxy_pass http://172.28.0.30:4000/ws/chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}